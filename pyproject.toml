
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-mm-terminal"
version = "1.0.0"
description = "3mm Terminal application service"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "service"}

[tool.setuptools.packages.find]
where = ["service"]
include = ["terminal*"]
