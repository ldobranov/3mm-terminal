
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-mm-terminal"
dynamic = ["version"]
description = "3mm Terminal application service"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
package-dir = {"" = "service", "terminal_provider" = "provider/terminal_provider"}

[tool.setuptools.packages.find]
where = ["service", "provider"]
include = ["terminal", "terminal.*", "terminal_provider", "terminal_provider.*"]
